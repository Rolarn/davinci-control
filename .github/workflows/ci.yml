# Проверки и тестовая сборка на каждый push. Zip — во вложениях запуска (artifact), это не релиз.
# Checks and a test build on every push. The zip is a run artifact, not a release.
name: ci
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq busybox shellcheck zip original-awk
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Tests
        run: bash tests/run_all.sh
      - name: Build
        run: scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: davinci-control-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          path: dist/*
          retention-days: 14
  # Метка тестовой сборки vX.Y.Z-rc.N на коммите, где поднят номер (файл RC) — чтобы по тегу найти код
  # Tag the test build vX.Y.Z-rc.N on the commit that bumped the number (RC file) — to find its code later
  tag-rc:
    needs: test
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          [ -f RC ] || exit 0
          t=$(sed -n 's/^version=//p' module/module.prop)-rc.$(cat RC)
          git ls-remote --exit-code --tags origin "refs/tags/$t" >/dev/null && { echo "$t уже есть / exists"; exit 0; }
          c=$(git log -n 1 --format=%H -- RC)
          git tag "$t" "$c" && git push origin "$t"
