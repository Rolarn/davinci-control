# Релиз при попадании в main версии, которой ещё нет в релизах: проверки, zip, тег vX.Y.Z,
# страница релиза (сначала RU, потом EN), update.json в main. В main попадает только то, что выпускаем.
# Release when main gets a version that has no release yet: checks, zip, the vX.Y.Z tag,
# release page (RU first, then EN), update.json on main. Only what we release goes to main.
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: New version?
        id: v
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          v=$(sed -n 's/^version=//p' module/module.prop); echo "v=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" >/dev/null 2>&1; then echo "$v уже выпущена / already released"; echo "new=0" >> "$GITHUB_OUTPUT"
          else echo "new=1" >> "$GITHUB_OUTPUT"; fi
      - name: Tools
        if: steps.v.outputs.new == '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq busybox shellcheck zip
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Tests
        if: steps.v.outputs.new == '1'
        run: bash tests/run_all.sh
      - name: Build
        if: steps.v.outputs.new == '1'
        run: |
          RELEASE=1 scripts/build.sh
          scripts/release-notes.sh "$(cat dist/*.zip.sha256)" > notes.md
      - name: Release
        if: steps.v.outputs.new == '1'
        env: { GH_TOKEN: '${{ github.token }}', V: '${{ steps.v.outputs.v }}' }
        run: gh release create "$V" dist/*.zip --target "$GITHUB_SHA" --title "Davinci Control ${V#v}" --notes-file notes.md --latest
      - name: update.json → main
        if: steps.v.outputs.new == '1'
        env: { V: '${{ steps.v.outputs.v }}' }
        run: |
          scripts/update-json.sh
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json && git commit -m "update.json → $V" && git push origin HEAD:main || echo "update.json без изменений / unchanged"
